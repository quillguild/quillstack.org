name: Deploy

on:
  push:
    branches: [main]

  # The package pages are built from the READMEs of thirty-four other repositories, so this site
  # goes stale without anything here changing. Rebuilding once a day is what keeps it honest.
  schedule:
    - cron: '17 5 * * *'

  # So a package that has just been released can have its page rebuilt without waiting for
  # tomorrow, and so a run can be asked for without pushing something to ask for it.
  repository_dispatch:
    types: [package-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A half-published site is worse than an old one: let a running deploy finish rather than
# cancelling it, and queue whatever came after.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install
        run: npm ci

      # This fetches every package's README. A package whose README cannot be read fails the
      # build rather than quietly losing its page.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
